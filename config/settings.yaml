# AI News Explainer - Configuration

# LLM Settings
llm:
  provider: "gemini"
  model: "gemini-2.0-flash-lite-001"
  temperature: 0.3
  max_tokens: 2000
  timeout: 30

# News Sources
news:
  sources:
    # STRICTLY Google News RSS as per new editor logic
    - type: "rss"
      name: "Google News"
      url: "https://news.google.com/rss/search?q={topic}&hl=en-US&gl=US&ceid=US:en"
  
  max_articles: 30
  min_article_length: 50 # Not strictly used for headlines, but good to keep safe
  remove_duplicates: true

# Content Generation
content:
  summary_length: 150  # words
  narration_style: "neutral"  # neutral, casual, formal
  target_duration: 90  # seconds
  
# Scene Planning
scenes:
  min_scene_duration: 5  # seconds
  max_scene_duration: 6  # seconds
  transition_duration: 0.5  # seconds
  
# Animation Settings
animation:
  engine: "moviepy"  # Changed from manim to moviepy
  quality: "medium_quality"  # low, medium, high, production
  fps: 30
  resolution: "1080p"  # 720p, 1080p, 4k
  background_color: "#1a1a2e"
  text_color: "#eee"
  accent_color: "#00d4ff"
  font: "Inter"
  
# Text-to-Speech
tts:
  engine: "edge-tts"  # edge-tts (recommended for realism), gtts, or pyttsx3
  voice: "en-US-EricNeural"  # Male News Anchor for Edge TTS
  speed: 1.0
  pitch: 1.0
  
# Video Composition
video:
  # ---- Feature flag ----
  generate_video: true  # Set to true to enable video generation

  # ---- Output settings ----
  output_format: "mp4"
  codec: "libx264"
  audio_codec: "aac"
  bitrate: "5000k"

  # ---- Resolution & timing ----
  width: 1920
  height: 1080
  fps: 24

  # ---- Visual defaults (IMPORTANT – fixes your error) ----
  background_color: "#0F172A"   # Dark slate
  text_color: "#FFFFFF"         # Safe fallback (prevents hex error)
  highlight_color: "#38BDF8"    # Accent color (optional)

  # ---- Audio options ----
  background_music: false
  background_music_volume: 0.1

# Output Paths
paths:
  output_dir: "output"
  assets_dir: "assets"
  temp_dir: "temp"
  
# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "logs/app.log"
  console: true
