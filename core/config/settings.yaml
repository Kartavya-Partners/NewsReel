# AI News Explainer - Configuration

# LLM Settings
llm:
  provider: "gemini"
  model: "gemini-2.5-flash"  # Default model
  temperature: 0.3
  max_tokens: 2000
  timeout: 30
  
  # Agent-Specific Models
  agents:
    summarization: "gemini-2.5-flash"
    script_writer: "gemini-2.5-flash"

# News Sources
news:
  sources:
    # STRICTLY Google News RSS as per new editor logic
    - type: "rss"
      name: "Google News"
      url: "https://news.google.com/rss/search?q={topic}&hl=en-US&gl=US&ceid=US:en"
  
  max_articles: 30
  min_article_length: 50 # Not strictly used for headlines, but good to keep safe
  remove_duplicates: true

# Content Generation
content:
  summary_length: 400  # Increased for detailed coverage
  narration_style: "neutral"  # neutral, casual, formal
  target_duration: 180  # Increased to 3 mins for depth
  
# Scene Planning
scenes:
  max_scenes: 5 # Limit total scenes
  min_scene_duration: 5  # seconds
  max_scene_duration: 6  # seconds
  transition_duration: 0.5  # seconds
  
# Animation Settings
animation:
  engine: "moviepy"  # Changed from manim to moviepy
  quality: "medium_quality"  # low, medium, high, production
  fps: 30
  resolution: "1080p"  # 720p, 1080p, 4k
  background_color: "#1a1a2e"
  text_color: "#eee"
  accent_color: "#00d4ff"
  font: "Inter"
  
# Text-to-Speech
tts:
  engine: "gtts"
  voice: "en-US-EricNeural"  # Male News Anchor for Edge TTS
  speed: 1.0
  pitch: 1.0
  
# Video Composition
video:
  # ---- Feature flag ----
  generate_video: true  # Set to true to enable video generation

  # ---- Video Generation Model (Wan 2.5) ----
  generation:
    enable: true
    provider: "local" # piapi, pollinations, local
    model: "wan-2.1-14b"  # Wan 2.1 Model name
    local_wan_path: "../Wan-Video" # Path to Wan-Video repo (sibling directory)
    local_checkpoint_path: "./weights/Wan2.1-I2V-14B-720P" # Path to weights


  # ---- Output settings ----
  output_format: "mp4"
  codec: "libx264"
  audio_codec: "aac"
  bitrate: "5000k"

  # ---- Resolution & timing ----
  width: 1920
  height: 1080
  fps: 24

  # ---- Visual defaults (IMPORTANT – fixes your error) ----
  background_color: "#0F172A"   # Dark slate
  text_color: "#FFFFFF"         # Safe fallback (prevents hex error)
  highlight_color: "#38BDF8"    # Accent color (optional)

  # ---- Audio options ----
  background_music: false
  background_music_volume: 0.1

# Output Paths
paths:
  output_dir: "output"
  assets_dir: "assets"
  temp_dir: "temp"
  
# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "logs/app.log"
  console: true
